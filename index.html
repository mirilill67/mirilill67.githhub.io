<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Y2K: Global Defense Matrix (Retro HUD)</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
</head>
<body>

  <div id="root"></div>

  <script>
    const { useState, useEffect, useRef } = React;
    const e = React.createElement;

    function Y2KAlienGame() {
      const [gameState, setGameState] = useState("START");
      const [score, setScore] = useState(0);
      
      const [highScore, setHighScore] = useState(() => {
        const saved = localStorage.getItem("y2k_global_high_score");
        return saved ? parseInt(saved, 10) : 0;
      });

      const canvasRef = useRef(null);
      const player = useRef({ x: 185, y: 410, width: 30, height: 25, speed: 8.5 });
      const keys = useRef({ Left: false, Right: false, Space: false });
      const lasers = useRef([]);
      const aliens = useRef([]);
      const lastFired = useRef(0);
      
      // NEW: Tracking mouse positioning for drawing the custom Y2K crosshair HUD
      const mousePos = useRef({ x: -100, y: -100 });
      const globeRotationRef = useRef(0);

      const scoreRef = useRef(0);
      useEffect(() => {
        scoreRef.current = score;
      }, [score]);

      // Keyboard Input Map Listener Loops
      useEffect(() => {
        const handleKeyDown = (ev) => {
          if (ev.key === "ArrowLeft" || ev.key === "a" || ev.key === "A") keys.current.Left = true;
          if (ev.key === "ArrowRight" || ev.key === "d" || ev.key === "D") keys.current.Right = true;
          if (ev.key === " " || ev.code === "Space") keys.current.Space = true;
        };

        const handleKeyUp = (ev) => {
          if (ev.key === "ArrowLeft" || ev.key === "a" || ev.key === "A") keys.current.Left = false;
          if (ev.key === "ArrowRight" || ev.key === "d" || ev.key === "D") keys.current.Right = false;
          if (ev.key === " " || ev.code === "Space") keys.current.Space = false;
        };

        window.addEventListener("keydown", handleKeyDown);
        window.addEventListener("keyup", handleKeyUp);
        return () => {
          window.removeEventListener("keydown", handleKeyDown);
          window.removeEventListener("keyup", handleKeyUp);
        };
      }, []);

      const registerPoints = (points) => {
        setScore(prev => {
          const nextScore = prev + points;
          if (nextScore > highScore) {
            setHighScore(nextScore);
            localStorage.setItem("y2k_global_high_score", nextScore.toString());
          }
          return nextScore;
        });
      };

      // Handle click logic based on the custom vector coordinate frame
      const handleCanvasClick = (event) => {
        if (gameState !== "PLAYING" || !canvasRef.current) return;

        const rect = canvasRef.current.getBoundingClientRect();
        const mouseX = event.clientX - rect.left;
        const mouseY = event.clientY - rect.top;

        aliens.current = aliens.current.filter(alien => {
          const clickedAlien = 
            mouseX >= alien.x &&
            mouseX <= alien.x + alien.width &&
            mouseY >= alien.y &&
            mouseY <= alien.y + alien.height;

          if (clickedAlien) {
            registerPoints(100);
            return false;
          }
          return true;
        });
      };

      // NEW: Capture custom mouse coordinates inside canvas view coordinate matrix 
      const handleMouseMove = (event) => {
        if (!canvasRef.current) return;
        const rect = canvasRef.current.getBoundingClientRect();
        mousePos.current = {
          x: event.clientX - rect.left,
          y: event.clientY - rect.top
        };
      };

      // Core Game Engine Frame Loop
      useEffect(() => {
        if (gameState !== "PLAYING") return;

        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        let animationFrameId;

        canvas.width = 400;
        canvas.height = 500;

        const loop = () => {
          const now = Date.now();

          // Move Player
          if (keys.current.Left && player.current.x > 0) {
            player.current.x -= player.current.speed;
          }
          if (keys.current.Right && player.current.x < canvas.width - player.current.width) {
            player.current.x += player.current.speed;
          }

          // Laser Fire Matrix Control
          if (keys.current.Space && now - lastFired.current > 180) {
            lasers.current.push({
              x: player.current.x + player.current.width / 2 - 2,
              y: player.current.y,
              width: 4,
              height: 14,
              speed: 12
            });
            lastFired.current = now;
          }

          // Evolving Fleet Spawn Limits
          const maxAliensOnScreen = 1 + Math.floor(scoreRef.current / 400);

          if (aliens.current.length < maxAliensOnScreen) {
            if (Math.random() < 0.06) {
              aliens.current.push({
                x: Math.random() * (canvas.width - 32),
                y: -25,
                width: 32,
                height: 22,
                speed: 2.5 + Math.random() * 2.2 
              });
            }
          }

          lasers.current = lasers.current.filter(laser => {
            laser.y -= laser.speed;
            return laser.y > 0;
          });

          let terminalGlobalBreach = false;

          aliens.current = aliens.current.filter(alien => {
            alien.y += alien.speed;

            const globeBreachHeight = canvas.height - 40; 
            if (alien.y > globeBreachHeight) {
              terminalGlobalBreach = true;
              return false;
            }

            const kineticImpact = 
              alien.x < player.current.x + player.current.width &&
              alien.x + alien.width > player.current.x &&
              alien.y < player.current.y + player.current.height &&
              alien.y + alien.height > player.current.y;

            if (kineticImpact) {
              terminalGlobalBreach = true;
              return false;
            }

            let alienSurvived = true;
            lasers.current = lasers.current.filter(laser => {
              const insideTarget = 
                laser.x < alien.x + alien.width &&
                laser.x + laser.width > alien.x &&
                laser.y < alien.y + alien.height &&
                laser.y + laser.height > alien.y;

              if (insideTarget) {
                registerPoints(100);
                alienSurvived = false;
                return false;
              }
              return true;
            });

            return alienSurvived;
          });

          if (terminalGlobalBreach) {
            setGameState("GAMEOVER");
            return;
          }
          
          globeRotationRef.current += 0.012;

          ctx.clearRect(0, 0, canvas.width, canvas.height);

          // RENDER: Stylized Y2K Rotating Cyber Globe Object
          const drawCyberGlobe = () => {
            const centerX = canvas.width / 2;
            const centerY = canvas.height - 10;
            const radius = 60;

            ctx.shadowBlur = 15;
            ctx.shadowColor = "#00ffff";
            ctx.fillStyle = "rgba(0, 255, 255, 0.15)";
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, Math.PI, 0);
            ctx.fill();

            ctx.shadowBlur = 0; 
            ctx.strokeStyle = "#00ffff";
            ctx.lineWidth = 1;

            for (let lat = 10; lat <= radius - 10; lat += 15) {
              const span = radius - lat;
              const angle = Math.acos(span / radius);
              const chordLength = Math.sin(angle) * radius;
              ctx.beginPath();
              ctx.arc(centerX, centerY, chordLength, Math.PI, 0, false);
              ctx.stroke();
            }

            const numLines = 8;
            for (let i = 0; i < numLines; i++) {
              const angleOffset = (i / numLines * Math.PI * 2) + globeRotationRef.current;
              const curveParam = radius / 2 * Math.sin(angleOffset);
              ctx.beginPath();
              ctx.moveTo(centerX - radius, centerY);
              ctx.quadraticCurveTo(centerX + curveParam * 2, centerY - radius * 1.6, centerX + radius, centerY);
              ctx.stroke();
            }
            
            ctx.beginPath();
            ctx.moveTo(centerX - radius, centerY);
            ctx.lineTo(centerX + radius, centerY);
            ctx.stroke();
          };
          
          drawCyberGlobe();

          // RENDER: Player Vessel
          ctx.fillStyle = "#00ffcc";
          ctx.shadowBlur = 12;
          ctx.shadowColor = "#00ffcc";
          ctx.beginPath();
          ctx.moveTo(player.current.x + player.current.width / 2, player.current.y);
          ctx.lineTo(player.current.x, player.current.y + player.current.height);
          ctx.lineTo(player.current.x + player.current.width, player.current.y + player.current.height);
          ctx.closePath();
          ctx.fill();

          // RENDER: Plasma Lasers
          ctx.fillStyle = "#00ffff";
          ctx.shadowColor = "#00ffff";
          lasers.current.forEach(laser => {
            ctx.fillRect(laser.x, laser.y, laser.width, laser.height);
          });

          // RENDER: Alien Invasion Ships
          ctx.fillStyle = "#ff00ff";
          ctx.shadowColor = "#ff00ff";
          aliens.current.forEach(alien => {
            ctx.fillRect(alien.x + 4, alien.y, alien.width - 8, 6);
            ctx.fillRect(alien.x, alien.y + 6, alien.width, 8);
            ctx.fillRect(alien.x + 2, alien.y + 14, 6, 6);
            ctx.fillRect(alien.x + alien.width - 8, alien.y + 14, 6, 6);
            ctx.fillRect(alien.x + 8, alien.y + 20, 4, 2);
            ctx.fillRect(alien.x + alien.width - 12, alien.y + 20, 4, 2);
          });

          // NEW RENDER BLOCK: Custom Round Y2K Neon Targeting Scope HUD
          const drawY2KCrosshair = () => {
            const hX = mousePos.current.x;
            const hY = mousePos.current.y;
            
            // Only draw if the pointer boundary is currently inside the canvas viewport frame
            if (hX < 0 || hX > canvas.width || hY < 0 || hY > canvas.height) return;

            // Outer Soft Aura Target Radar Ring
            ctx.strokeStyle = "rgba(0, 255, 255, 0.35)";
            ctx.lineWidth = 1;
            ctx.shadowBlur = 6;
            ctx.shadowColor = "#00ffff";
            ctx.beginPath();
            ctx.arc(hX, hY, 15, 0, Math.PI * 2);
            ctx.stroke();

            // Inner Core Sharp Reticle Circle
            ctx.strokeStyle = "#00ffff";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(hX, hY, 7, 0, Math.PI * 2);
            ctx.stroke();

            // Central Laser-Lock Target Center Dot
            ctx.fillStyle = "#ff00ff";
            ctx.shadowColor = "#ff00ff";
            ctx.beginPath();
            ctx.arc(hX, hY, 2, 0, Math.PI * 2);
            ctx.fill();

            // 4 Vector Crosshair Target Line Identifiers (Top, Bottom, Left, Right ticks)
            ctx.strokeStyle = "#00ffff";
            ctx.lineWidth = 1.2;
            
            ctx.beginPath();
            // Top tick line
            ctx.moveTo(hX, hY - 15); ctx.lineTo(hX, hY - 9);
            // Bottom tick line
            ctx.moveTo(hX, hY + 15); ctx.lineTo(hX, hY + 9);
            // Left tick line
            ctx.moveTo(hX - 15, hY); ctx.lineTo(hX - 9, hY);
            // Right tick line
            ctx.moveTo(hX + 15, hY); ctx.lineTo(hX + 9, hY);
            ctx.stroke();
          };

          drawY2KCrosshair();

          // Reset canvas glow layer cache state entirely before the next frame loop pass
          ctx.shadowBlur = 0;
          animationFrameId = requestAnimationFrame(loop);
        };

        animationFrameId = requestAnimationFrame(loop);
        return () => cancelAnimationFrame(animationFrameId);
      }, [gameState, highScore]);

      const startMatch = () => {
        setScore(0);
        scoreRef.current = 0;
        lasers.current = [];
        aliens.current = [];
        player.current.x = 185;
        setGameState("PLAYING");
      };

      const setNeonStyles = (event, isHovered) => {
        event.currentTarget.style.background = isHovered ? "#ff00ff" : "transparent";
        event.currentTarget.style.color = isHovered ? "#000000" : "#ffffff";
        event.currentTarget.style.boxShadow = isHovered ? "0 0 20px #00ffff" : "0 0 10px #ff00ff";
      };

      return e('div', { style: styles.body },
        e('div', { style: styles.stars }),
        e('style', null, cssKeyframes),
        e('div', { style: styles.viewContainer },
          e('h1', { style: styles.mainTitle }, "GLOBAL DEFENDER Y2K"),
          
          gameState === "START" && e('div', { style: styles.uiBox },
            e('p', { style: { ...styles.subtitle, ...styles.blinkEffect } }, "INVASION CONFIRMED... THE GLOBE IS IN DANGER!"),
            e('p', { style: { color: "#00ffcc", fontSize: "14px", marginBottom: "30px" } }, `DEFENSE RECORD: ${String(highScore).padStart(5, "0")} UNITS SAVED`),
            e('button', {
              style: styles.actionBtn,
              onClick: startMatch,
              onMouseOver: (evt) => setNeonStyles(evt, true),
              onMouseOut: (evt) => setNeonStyles(evt, false)
            }, "DEPLOY PLASMA NETWORK")
          ),

          gameState === "PLAYING" && e('div', { style: styles.gameWrapper },
            e('div', { style: styles.hudPanel },
              e('div', { style: { display: "flex", flexDirection: "column" } },
                e('span', null, `SAVED: ${String(score).padStart(5, "0")} UNITS`),
                e('span', { style: { fontSize: "11px", color: "#ff00ff", marginTop: "2px" } }, `HI-SCORE: ${String(highScore).padStart(5, "0")}`)
              ),
              e('span', { style: { color: "#00ffcc", textAlign: "right" } }, "LOCK RETICLE ON TARGET")
            ),
            e('div', { style: styles.canvasContainer },
              e('canvas', { 
                ref: canvasRef, 
                style: styles.gameCanvas,
                onClick: handleCanvasClick,
                onMouseMove: handleMouseMove // Track frame pointer path changes
              })
            ),
            e('p', { style: styles.controlLabel }, "[A/D or ◀/▶] MOVE | [SPACE] SHOOT | CYBER SCOPE ON TARGET TO CLICK")
          ),

          gameState === "GAMEOVER" && e('div', { style: styles.uiBox },
            e('h2', { style: styles.defeatHeader }, "GLOBE BREACHED!"),
            e('p', { style: { color: "#ffffff", marginBottom: "10px", fontSize: "15px" } }, `Alien forces have made contact with the matrix core.`),
            e('p', { style: { color: "#00ffff", marginBottom: "25px", fontSize: "13px" } }, score >= highScore && score > 0 ? "🔥 NEW LOCAL DEFENSE NETWORK RECORD ACTIVE!" : `Your Final Defense Tally: ${score}`),
            e('button', {
              style: styles.actionBtn,
              onClick: startMatch,
              onMouseOver: (evt) => setNeonStyles(evt, true),
              onMouseOut: (evt) => setNeonStyles(evt, false)
            }, "REBOOT DEFENSE PROTOCOLS")
          )
        )
      );
    }

    const styles = {
      body: { margin: 0, height: "100vh", backgroundColor: "#120018", fontFamily: '"Courier New", monospace', color: "#ffffff", overflow: "hidden", position: "relative" },
      stars: { position: "absolute", width: "100%", height: "100%", background: "radial-gradient(white 1px, transparent 1px)", backgroundSize: "60px 60px", opacity: 0.12, animation: "scrollStars 25s linear infinite" },
      viewContainer: { position: "relative", height: "100%", display: "flex", flexDirection: "column", justifyContent: "center", alignItems: "center", zIndex: 2 },
      mainTitle: { fontSize: "38px", color: "#ff00ff", margin: "0 0 15px 0", letterSpacing: "3px", textTransform: "uppercase", animation: "neonPulse 2s infinite alternate", textAlign: "center" },
      uiBox: { textAlign: "center", padding: "20px" },
      subtitle: { fontSize: "15px", color: "#00ffff", letterSpacing: "2px", marginBottom: "10px" },
      blinkEffect: { animation: "terminalBlink 1s infinite" },
      actionBtn: { padding: "12px 35px", border: "2px solid #ff00ff", background: "transparent", color: "#ffffff", cursor: "pointer", textTransform: "uppercase", fontFamily: '"Courier New", monospace', fontWeight: "bold", fontSize: "14px", letterSpacing: "1px", transition: "all 0.2s ease-in-out", boxShadow: "0 0 10px #ff00ff" },
      gameWrapper: { display: "flex", flexDirection: "column", alignItems: "center" },
      hudPanel: { width: "400px", display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 12px", border: "2px solid #00ffff", borderBottom: "none", background: "#08000c", color: "#00ffff", boxSizing: "border-box", fontWeight: "bold", fontSize: "14px" },
      canvasContainer: { position: "relative", width: "400px", height: "500px" },
      // MODIFIED: Injected "cursor: none" property block to strip away default native pointer elements completely
      gameCanvas: { border: "2px solid #00ffff", background: "#0a000f", boxShadow: "0 0 25px rgba(0, 255, 255, 0.25)", cursor: "none" }, 
      defeatHeader: { fontSize: "36px", color: "#ff0033", margin: "0 0 15px 0", textShadow: "0 0 12px #ff0033", letterSpacing: "2px" },
      controlLabel: { fontSize: "11px", color: "#ff00ff", marginTop: "12px", letterSpacing: "1px" }
    };

    const cssKeyframes = `
      @keyframes scrollStars { from { transform: translateY(0); } to { transform: translateY(-120px); } }
      @keyframes neonPulse { from { text-shadow: 0 0 8px #ff00ff; } to { text-shadow: 0 0 22px #00ffff; } }
      @keyframes terminalBlink { 50% { opacity: 0; } }
    `;

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(Y2KAlienGame));
  </script>
</body>
</html>
