<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Y2K Alien Zone</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      cursor: crosshair;
    }

    body {
      overflow: hidden;
      height: 100vh;
      background: radial-gradient(circle at center, #6d28d9 0%, #2a0050 40%, #120020 100%);
      font-family: "Comic Sans MS", cursive, sans-serif;
      position: relative;
      color: white;
    }

    /* animated stars */
    .stars {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(#ff9dff 1px, transparent 1px),
        radial-gradient(#8be9fd 1px, transparent 1px);
      background-size: 120px 120px, 180px 180px, 240px 240px;
      animation: twinkle 8s linear infinite;
      opacity: 0.8;
    }

    @keyframes twinkle {
      from {
        transform: translateY(0);
      }
      to {
        transform: translateY(-120px);
      }
    }

    /* giant glowing title */
    .title {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 5rem;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: #ff66ff;
      text-shadow:
        0 0 10px #ff00ff,
        0 0 20px #ff00ff,
        0 0 40px #00ffff,
        0 0 60px #00ffff;
      z-index: 10;
      animation: pulse 2s infinite alternate;
      text-align: center;
    }

    @keyframes pulse {
      from {
        transform: translate(-50%, -50%) scale(1);
      }
      to {
        transform: translate(-50%, -50%) scale(1.05);
      }
    }

    /* UFOs */
    .ufo {
      position: absolute;
      width: 140px;
      height: 70px;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      filter: drop-shadow(0 0 10px cyan);
    }

    .ufo .top {
      position: absolute;
      width: 60px;
      height: 30px;
      background: #8be9fd;
      border-radius: 50%;
      top: 0;
      left: 40px;
      opacity: 0.9;
    }

    .ufo .base {
      position: absolute;
      width: 140px;
      height: 40px;
      background: linear-gradient(to bottom, #d0d0d0, #666);
      border-radius: 50%;
      bottom: 0;
      border: 3px solid #00ffff;
    }

    .light {
      position: absolute;
      width: 10px;
      height: 10px;
      background: lime;
      border-radius: 50%;
      bottom: 12px;
      box-shadow: 0 0 10px lime;
      animation: blink 1s infinite alternate;
    }

    @keyframes blink {
      from {
        opacity: 0.3;
      }
      to {
        opacity: 1;
      }
    }

    /* movement paths */
    .ufo1 {
      top: 10%;
      left: -200px;
      animation: fly1 18s linear infinite;
    }

    .ufo2 {
      top: 60%;
      left: -300px;
      transform: scale(0.8);
      animation: fly2 25s linear infinite;
    }

    .ufo3 {
      top: 30%;
      left: -250px;
      transform: scale(1.2);
      animation: fly3 20s linear infinite;
    }

    @keyframes fly1 {
      to {
        transform: translateX(120vw) translateY(50px);
      }
    }

    @keyframes fly2 {
      to {
        transform: translateX(130vw) translateY(-80px) scale(0.8);
      }
    }

    @keyframes fly3 {
      to {
        transform: translateX(125vw) translateY(100px) scale(1.2);
      }
    }

    /* y2k decorative boxes */
    .panel {
      position: absolute;
      border: 2px solid #00ffff;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(4px);
      padding: 10px 20px;
      box-shadow:
        0 0 10px #00ffff,
        inset 0 0 10px #ff00ff;
      font-size: 1rem;
    }

    .panel.top-left {
      top: 20px;
      left: 20px;
    }

    .panel.bottom-right {
      bottom: 20px;
      right: 20px;
    }

    /* scanlines */
    .scanlines::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.03),
        rgba(255,255,255,0.03) 1px,
        transparent 2px,
        transparent 4px
      );
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>

<body class="scanlines">

  <div class="stars"></div>

  <div class="title">
    Alien Network
  </div>

  <div class="panel top-left">
    ★ INTERGALACTIC PORTAL ★
  </div>

  <div class="panel bottom-right">
    SIGNAL STATUS: ONLINE
  </div>

  <!-- UFO 1 -->
  <div class="ufo ufo1">
    <div class="top"></div>
    <div class="base"></div>

    <div class="light" style="left:20px;"></div>
    <div class="light" style="left:50px;"></div>
    <div class="light" style="left:80px;"></div>
    <div class="light" style="left:110px;"></div>
  </div>

  <!-- UFO 2 -->
  <div class="ufo ufo2">
    <div class="top"></div>
    <div class="base"></div>

    <div class="light" style="left:20px;"></div>
    <div class="light" style="left:50px;"></div>
    <div class="light" style="left:80px;"></div>
    <div class="light" style="left:110px;"></div>
  </div>

  <!-- UFO 3 -->
  <div class="ufo ufo3">
    <div class="top"></div>
    <div class="base"></div>

    <div class="light" style="left:20px;"></div>
    <div class="light" style="left:50px;"></div>
    <div class="light" style="left:80px;"></div>
    <div class="light" style="left:110px;"></div>
  </div>

  <script>
    // Mouse glow effect
    const glow = document.createElement("div");

    glow.style.position = "fixed";
    glow.style.width = "200px";
    glow.style.height = "200px";
    glow.style.borderRadius = "50%";
    glow.style.pointerEvents = "none";
    glow.style.background =
      "radial-gradient(circle, rgba(255,0,255,0.25), transparent 70%)";
    glow.style.transform = "translate(-50%, -50%)";
    glow.style.zIndex = "5";

    document.body.appendChild(glow);

    document.addEventListener("mousemove", (e) => {
      glow.style.left = e.clientX + "px";
      glow.style.top = e.clientY + "px";
    });
  </script>

</body>
</html>
