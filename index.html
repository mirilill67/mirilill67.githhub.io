<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Y2K: Alien Space Interceptor</title>
  
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function Y2KAlienGame() {
      const [gameState, setGameState] = useState("START"); // START, PLAYING, GAMEOVER
      const [score, setScore] = useState(0);

      const canvasRef = useRef(null);
      
      // Mutable Game Architecture Refs (Prevents React re-render lag during high-frequency engine loops)
      const player = useRef({ x: 185, y: 440, width: 30, height: 25, speed: 7 });
      const keys = useRef({ Left: false, Right: false, Space: false });
      const lasers = useRef([]); // Dynamic array tracking active laser beams
      const aliens = useRef([]); // Dynamic array tracking active alien vessels
      const lastFired = useRef(0); // Shooting throttle timestamp

      // Capture Input Buffer States
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.current.Left = true;
          if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.current.Right = true;
          if (e.key === " " || e.code === "Space") keys.current.Space = true;
        };

        const handleKeyUp = (e) => {
          if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.current.Left = false;
          if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.current.Right = false;
          if (e.key === " " || e.code === "Space") keys.current.Space = false;
        };

        window.addEventListener("keydown", handleKeyDown);
        window.addEventListener("keyup", handleKeyUp);
        return () => {
          window.removeEventListener("keydown", handleKeyDown);
          window.removeEventListener("keyup", handleKeyUp);
        };
      }, []);

      // Core Game Engine Frame Loop
      useEffect(() => {
        if (gameState !== "PLAYING") return;

        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        let animationFrameId;

        // Establish uniform matrix dimensions
        canvas.width = 400;
        canvas.height = 500;

        const loop = () => {
          const now = Date.now();

          // 1. Player Translation Matrix
          if (keys.current.Left && player.current.x > 0) {
            player.current.x -= player.current.speed;
          }
          if (keys.current.Right && player.current.x < canvas.width - player.current.width) {
            player.current.x += player.current.speed;
          }

          // 2. Weapon Deployment (Rate of Fire: 220ms)
          if (keys.current.Space && now - lastFired.current > 220) {
            lasers.current.push({
              x: player.current.x + player.current.width / 2 - 2,
              y: player.current.y,
              width: 4,
              height: 14,
              speed: 9
            });
            lastFired.current = now;
          }

          // 3. Spawning Matrix for Alien Space Ships
          if (Math.random() < 0.025) {
            aliens.current.push({
              x: Math.random() * (canvas.width - 32),
              y: -25,
              width: 32,
              height: 22,
              speed: 1.2 + Math.random() * 1.8
            });
          }

          // 4. Update Projectile Tracking
          lasers.current = lasers.current.filter(laser => {
            laser.y -= laser.speed;
            return laser.y > 0;
          });

          // 5. Collision Detection Logic & Target Removal
          let terminalBreach = false;

          aliens.current = aliens.current.filter(alien => {
            alien.y += alien.speed;

            // Boundary Failure or Direct Fleet Collision
            const boundaryBreach = alien.y > canvas.height;
            const kineticImpact = 
              alien.x < player.current.x + player.current.width &&
              alien.x + alien.width > player.current.x &&
              alien.y < player.current.y + player.current.height &&
              alien.y + alien.height > player.current.y;

            if (boundaryBreach || kineticImpact) {
              terminalBreach = true;
              return false;
            }

            // Laser-to-Alien Matrix Intersection (AABB Box Collision)
            let alienSurvived = true;
            lasers.current = lasers.current.filter(laser => {
              const insideTarget = 
                laser.x < alien.x + alien.width &&
                laser.x + laser.width > alien.x &&
                laser.y < alien.y + alien.height &&
                laser.y + laser.height > alien.y;

              if (insideTarget) {
                setScore(prev => prev + 100);
                alienSurvived = false;
                return false; // Evict laser beam
              }
              return true;
            });

            return alienSurvived;
          });

          if (terminalBreach) {
            setGameState("GAMEOVER");
            return;
          }

          // 6. Draw Layer Functions
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          // Render Player Vessel (Cyan Plasma Triangle Profile)
          ctx.fillStyle = "#00ffcc";
          ctx.shadowBlur = 12;
          ctx.shadowColor = "#00ffcc";
          ctx.beginPath();
          ctx.moveTo(player.current.x + player.current.width / 2, player.current.y);
          ctx.lineTo(player.current.x, player.current.y + player.current.height);
          ctx.lineTo(player.current.x + player.current.width, player.current.y + player.current.height);
          ctx.closePath();
          ctx.fill();

          // Render Weapon Discharges (Neon Blue Beams)
          ctx.fillStyle = "#00ffff";
          ctx.shadowColor = "#00ffff";
          lasers.current.forEach(laser => {
            ctx.fillRect(laser.x, laser.y, laser.width, laser.height);
          });

          // Render Alien Ships (Y2K Neon Magenta Geometric Invader Chassis)
          ctx.fillStyle = "#ff00ff";
          ctx.shadowColor = "#ff00ff";
          aliens.current.forEach(alien => {
            // Main alien fuselage
            ctx.fillRect(alien.x + 4, alien.y, alien.width - 8, 6);
            ctx.fillRect(alien.x, alien.y + 6, alien.width, 8);
            // Wing sweeps & base configurations
            ctx.fillRect(alien.x + 2, alien.y + 14, 6, 6);
            ctx.fillRect(alien.x + alien.width - 8, alien.y + 14, 6, 6);
            ctx.fillRect(alien.x + 8, alien.y + 20, 4, 2);
            ctx.fillRect(alien.x + alien.width - 12, alien.y + 20, 4, 2);
          });

          // Clear global shadow layer cache
          ctx.shadowBlur = 0;
          animationFrameId = requestAnimationFrame(loop);
        };

        animationFrameId = requestAnimationFrame(loop);
        return () => cancelAnimationFrame(animationFrameId);
      }, [gameState]);

      const startMatch = () => {
        setScore(0);
        lasers.current = [];
        aliens.current = [];
        player.current.x = 185;
        setGameState("PLAYING");
      };

      const setNeonStyles = (e, isHovered) => {
        e.currentTarget.style.background = isHovered ? "#ff00ff" : "transparent";
        e.currentTarget.style.color = isHovered ? "#000000" : "#ffffff";
        e.currentTarget.style.boxShadow = isHovered ? "0 0 20px #00ffff" : "0 0 10px #ff00ff";
      };

      return (
        <div style={styles.body}>
          {/* Animated Star Field Texture */}
          <div style={styles.stars}></div>
          <style>{cssKeyframes}</style>

          <div style={styles.viewContainer}>
            <h1 style={styles.mainTitle}>CYBER DEFENDER Y2K</h1>

            {gameState === "START" && (
              <div style={styles.uiBox}>
                <p style={{ ...styles.subtitle, ...styles.blinkEffect }}>
                  ALIEN FLEET ARRIVING... SECURE THE PERIMETER
                </p>
                <button 
                  style={styles.actionBtn} 
                  onClick={startMatch}
                  onMouseOver={(e) => setNeonStyles(e, true)}
                  onMouseOut={(e) => setNeonStyles(e, false)}
                >
                  INITIALIZE MATRIX
                </button>
              </div>
            )}

            {gameState === "PLAYING" && (
              <div style={styles.gameWrapper}>
                <div style={styles.hudPanel}>
                  <span>SCORE: {String(score).padStart(5, "0")}</span>
                  <span style={{ color: "#00ffcc" }}>FIREWALL: ENGAGED</span>
                </div>
                <div style={styles.canvasContainer}>
                  <canvas ref={canvasRef} style={styles.gameCanvas} />
                </div>
                <p style={styles.controlLabel}>[A / D] OR [◀ / ▶] TO MOVE | [SPACE] TO SHOOT</p>
              </div>
            )}

            {gameState === "GAMEOVER" && (
              <div style={styles.uiBox}>
                <h2 style={styles.defeatHeader}>SYSTEM OVERRIDE</h2>
                <p style={{ color: "#ffffff", marginBottom: "25px", fontSize: "14px" }}>
                  Alien crafts successfully breached your vector frame.<br/>Final Output Score: {score}
                </p>
                <button 
                  style={styles.actionBtn} 
                  onClick={startMatch}
                  onMouseOver={(e) => setNeonStyles(e, true)}
                  onMouseOut={(e) => setNeonStyles(e, false)}
                >
                  REBOOT CORE SYSTEM
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // Comprehensive CSS-in-JS Component Definition
    const styles = {
      body: { 
        margin: 0, 
        height: "100vh", 
        backgroundColor: "#120018", // Dark purple theme color
        fontFamily: '"Courier New", monospace', 
        color: "#ffffff", 
        overflow: "hidden", 
        position: "relative" 
      },
      stars: { 
        position: "absolute", 
        width: "100%", 
        height: "100%", 
        background: "radial-gradient(white 1px, transparent 1px)", 
        backgroundSize: "60px 60px", 
        opacity: 0.12, 
        animation: "scrollStars 25s linear infinite" 
      },
      viewContainer: { 
        position: "relative", 
        height: "100%", 
        display: "flex", 
        flexDirection: "column", 
        justifyContent: "center", 
        alignItems: "center", 
        zIndex: 2 
      },
      mainTitle: { 
        fontSize: "38px", 
        color: "#ff00ff", 
        margin: "0 0 15px 0", 
        letterSpacing: "3px",
        textTransform: "uppercase", 
        animation: "neonPulse 2s infinite alternate", 
        textAlign: "center" 
      },
      uiBox: {
        textAlign: "center",
        padding: "20px"
      },
      subtitle: { 
        fontSize: "15px", 
        color: "#00ffff", 
        letterSpacing: "2px", 
        marginBottom: "30px" 
      },
      blinkEffect: { 
        animation: "terminalBlink 1s infinite" 
      },
      actionBtn: { 
        padding: "12px 35px", 
        border: "2px solid #ff00ff", 
        background: "transparent", 
        color: "#ffffff", 
        cursor: "pointer", 
        textTransform: "uppercase", 
        fontFamily: '"Courier New", monospace', 
        fontWeight: "bold", 
        fontSize: "14px",
        letterSpacing: "1px",
        transition: "all 0.2s ease-in-out", 
        boxShadow: "0 0 10px #ff00ff" 
      },
      gameWrapper: { 
        display: "flex", 
        flexDirection: "column", 
        alignItems: "center" 
      },
      hudPanel: { 
        width: "400px", 
        display: "flex", 
        justifyContent: "space-between", 
        padding: "12px", 
        border: "2px solid #00ffff", 
        borderBottom: "none", 
        background: "#08000c", 
        color: "#00ffff", 
        boxSizing: "border-box", 
        fontWeight: "bold",
        fontSize: "14px"
      },
      canvasContainer: { 
        position: "relative", 
        width: "400px", 
        height: "500px" 
      },
      gameCanvas: { 
        border: "2px solid #00ffff", 
        background: "#0a000f", 
        boxShadow: "0 0 25px rgba(0, 255, 255, 0.25)" 
      },
      defeatHeader: { 
        fontSize: "36px", 
        color: "#ff0033", 
        margin: "0 0 15px 0", 
        textShadow: "0 0 12px #ff0033",
        letterSpacing: "2px"
      },
      controlLabel: { 
        fontSize: "11px", 
        color: "#ff00ff", 
        marginTop: "12px", 
        letterSpacing: "1px" 
      }
    };

    // Native CSS Keyframes String Injection
    const cssKeyframes = `
      @keyframes scrollStars { from { transform: translateY(0); } to { transform: translateY(-120px); } }
      @keyframes neonPulse { from { text-shadow: 0 0 8px #ff00ff; } to { text-shadow: 0 0 22px #00ffff; } }
      @keyframes terminalBlink { 50% { opacity: 0; } }
    `;

    // Hook Application into Browser Document Object Model
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Y2KAlienGame />);
  </script>
</body>
</html>
