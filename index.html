<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Y2K: Global Defense Matrix (Retro HUD)</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
</head>
<body>

  <div id="root"></div>

  <script>
    const { useState, useEffect, useRef } = React;
    const e = React.createElement;

    function Y2KAlienGame() {
      const [gameState, setGameState] = useState("START");
      const [score, setScore] = useState(0);
      
      const [highScore, setHighScore] = useState(() => {
        const saved = localStorage.getItem("y2k_global_high_score");
        return saved ? parseInt(saved, 10) : 0;
      });

      const canvasRef = useRef(null);
      const player = useRef({ x: 185, y: 410, width: 30, height: 25, speed: 8.5 });
      const keys = useRef({ Left: false, Right: false, Space: false });
      const lasers = useRef([]);
      const aliens = useRef([]);
      const lastFired = useRef(0);
      
      // NEW: Tracking mouse positioning for drawing the custom Y2K crosshair HUD
      const mousePos = useRef({ x: -100, y: -100 });
      const globeRotationRef = useRef(0);

      const scoreRef = useRef(0);
      useEffect(() => {
        scoreRef.current = score;
      }, [score]);

      // Keyboard Input Map Listener Loops
      useEffect(() => {
        const handleKeyDown = (ev) => {
          if (ev.key === "ArrowLeft" || ev.key === "a" || ev.key === "A") keys.current.Left = true;
          if (ev.key === "ArrowRight" || ev.key === "d" || ev.key === "D") keys.current.Right = true;
          if (ev.key === " " || ev.code === "Space") keys.current.Space = true;
        };

        const handleKeyUp = (ev) => {
          if (ev.key === "ArrowLeft" || ev.key === "a" || ev.key === "A") keys.current.Left = false;
          if (ev.key === "ArrowRight" || ev.key === "d" || ev.key === "D") keys.current.Right = false;
          if (ev.key === " " || ev.code === "Space") keys.current.Space = false;
        };

        window.addEventListener("keydown", handleKeyDown);
        window.addEventListener("keyup", handleKeyUp);
        return () => {
          window.removeEventListener("keydown", handleKeyDown);
          window.removeEventListener("keyup", handleKeyUp);
        };
      }, []);

      const registerPoints = (points) => {
        setScore(prev => {
          const nextScore = prev + points;
          if (nextScore > highScore) {
            setHighScore(nextScore);
            localStorage.setItem("y2k_global_high_score", nextScore.toString());
          }
          return nextScore;
        });
      };

      // Handle click logic based on the custom vector coordinate frame
      const handleCanvasClick = (event) => {
        if (gameState !== "PLAYING" || !canvasRef.current) return;

        const rect = canvasRef.current.getBoundingClientRect();
        const mouseX = event.clientX - rect.left;
        const mouseY = event.clientY - rect.top;

        aliens.current = aliens.current.filter(alien => {
          const clickedAlien = 
            mouseX >= alien.x &&
            mouseX <= alien.x + alien.width &&
            mouseY >= alien.y &&
            mouseY <= alien.y + alien.height;

          if (clickedAlien) {
            registerPoints(100);
            return false;
          }
          return true;
        });
      };

      // NEW: Capture custom mouse coordinates inside canvas view coordinate matrix 
      const handleMouseMove = (event) => {
        if (!canvasRef.current) return;
        const rect = canvasRef.current.getBoundingClientRect();
        mousePos.current = {
          x: event.clientX - rect.left,
          y: event.clientY - rect.top
        };
      };

      // Core Game Engine Frame Loop
      useEffect(() => {
        if (gameState !== "PLAYING") return;

        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        let animationFrameId;

        canvas.width = 400;
        canvas.height = 500;

        const loop = () => {
          const now = Date.now();

          // Move Player
          if (keys.current.Left && player.current.x > 0) {
            player.current.x -= player.current.speed;
          }
          if (keys.current.Right && player.current.x < canvas.width - player.current.width) {
            player.current.x += player.current.speed;
          }

          // Laser Fire Matrix Control
          if (keys.current.Space && now - lastFired.current > 180) {
            lasers.current.push({
              x: player.current.x + player.current.width / 2 - 2,
              y: player.current.y,
              width: 4,
              height: 14,
              speed: 12
            });
            lastFired.current = now;
          }

          // Evolving Fleet Spawn Limits
          const maxAliensOnScreen = 1 + Math.floor(scoreRef.current / 400);

          if (aliens.current.length < maxAliensOnScreen) {
            if (Math.random() < 0.06) {
              aliens.current.push({
                x: Math.random() * (canvas.width - 32),
                y: -25,
                width: 32,
                height: 22,
                speed: 2.5 + Math.random() * 2.2 
              });
            }
          }

          lasers.current = lasers.current.filter(laser => {
            laser.y -= laser.speed;
            return laser.y > 0;
          });

          let terminalGlobalBreach = false;

          aliens.current = aliens.current.filter(alien => {
            alien.y += alien.speed;

            const globeBreachHeight = canvas.height - 40; 
            if (alien.y > globeBreachHeight) {
              terminalGlobalBreach = true;
              return false;
            }

            const kineticImpact = 
              alien.x < player.current.x + player.current.width &&
              alien.x + alien.width > player.current.x &&
              alien.y < player.current.y + player.current.height &&
              alien.y + alien.height > player.current.y;

            if (kineticImpact) {
              terminalGlobalBreach = true;
              return false;
            }

            let alienSurvived = true;
            lasers.current = lasers.current.filter(laser => {
              const insideTarget = 
                laser.x < alien.x + alien.width &&
                laser.x + laser.width > alien.x &&
                laser.y < alien.y + alien.height &&
                laser.y + laser.height > alien.y;

              if (insideTarget) {
                registerPoints(100);
                alienSurvived = false;
                return false;
              }
              return true;
            });

            return alienSurvived;
          });

          if (terminalGlobalBreach) {
            setGameState("GAMEOVER");
            return;
          }
          
          globeRotationRef.current += 0.012;

          ctx.clearRect(0, 0, canvas.width, canvas.height);

          // RENDER: Stylized Y2K Rotating Cyber Globe Object
          const drawCyberGlobe = () => {
            const centerX = canvas.width / 2;
            const centerY = canvas.height - 10;
            const radius = 60;

            ctx.shadowBlur = 15;
            ctx.shadowColor = "#00ffff
